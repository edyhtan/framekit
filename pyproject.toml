[project]
name = "framekit"
version = "0.1.0"
description = "AI building blocks for video datasets: provider-neutral contracts, model access, and (soon) frame selection and corpus extraction"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Library convention (docs/ARCHITECTURE.md §2): loose ranges, so framekit fits into
# consumers' environments. Exact versions for development are in uv.lock.
dependencies = [
    "pydantic>=2.6,<3",
    "openai>=3.20,<4",
    "anthropic>=1.9,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "import-linter>=2",
    "ruff>=0.6",
]

[tool.uv]
# Supply-chain cooldown (DECISIONS 2026-10-23, "Security checks"): resolve only releases
# uploaded at least 7 days ago, so a compromised release is usually caught and yanked
# before it reaches uv.lock. Applies to framekit's own development and CI, not to
# consumers (they resolve their own environments).
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S: flake8-bandit security rules (DECISIONS 2026-10-23, "Security checks").
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts are how tests check results. Only S101 is relaxed: the hardcoded-secret
# rules (S105-S107) stay on in tests too, so a real key pasted into a test is still caught.
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["framekit"]

# Layer rules (docs/ARCHITECTURE.md §2.1): run with `uv run lint-imports`.
[tool.importlinter]
root_package = "framekit"
include_external_packages = true

[[tool.importlinter.contracts]]
# vision and models are independent siblings: neither may import the other.
name = "Layers: vision | models -> contracts"
type = "layers"
layers = [
    "framekit.vision | framekit.models",
    "framekit.contracts",
]

[[tool.importlinter.contracts]]
name = "Contracts are pure: no provider SDK, model library or I/O framework"
type = "forbidden"
source_modules = ["framekit.contracts"]
forbidden_modules = ["openai", "anthropic", "pydantic", "httpx", "httpx2"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Provider SDKs only inside the adapters"
type = "forbidden"
source_modules = [
    "framekit.contracts",
    "framekit.models.catalog",
    "framekit.models.router",
    "framekit.models.cache",
    "framekit.vision",
]
forbidden_modules = ["openai", "anthropic"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "No model-access libraries or agent frameworks (DECISIONS 2026-10-23)"
type = "forbidden"
source_modules = ["framekit"]
forbidden_modules = [
    "langchain", "langchain_core", "langchain_openai", "langchain_anthropic",
    "langchain_deepseek", "langsmith", "langgraph", "litellm",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "No consumer code: no web framework, ORM, queue or key-value client"
type = "forbidden"
source_modules = ["framekit"]
forbidden_modules = ["fastapi", "sqlalchemy", "dramatiq", "redis"]
allow_indirect_imports = true
